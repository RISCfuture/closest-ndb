name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.3'
      # `latest-stable` Xcode drifts, so the resolved compiler identifies the cache.
      - name: Record toolchain version
        id: toolchain
        run: |
          version="$(swift --version | head -1)-$(xcodebuild -version | head -1)"
          echo "id=$(printf '%s' "$version" | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            generate-navaids/.build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-test-macos-26-${{ steps.toolchain.outputs.id }}-${{ hashFiles('generate-navaids/Package.resolved') }}
      - name: Build
        run: cd generate-navaids && swift build -v
  lint:
    name: Run SwiftLint
    runs-on: macos-26
    defaults:
      run:
        working-directory: generate-navaids
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict
  swift-format:
    name: Run swift-format
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - uses: actions/checkout@v6
      - name: Download .swift-format config
        run: |
          apt-get update && apt-get install -y wget
          wget -O generate-navaids/.swift-format https://gist.githubusercontent.com/RISCfuture/e0c21afb7bd80a88d128a42bf40d2ecd/raw/.swift-format
      - name: Run swift-format lint
        run: cd generate-navaids && swift format lint --strict -r .
  docs:
    name: Build Documentation
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.3'
      # `latest-stable` Xcode drifts, so the resolved compiler identifies the cache.
      - name: Record toolchain version
        id: toolchain
        run: |
          version="$(swift --version | head -1)-$(xcodebuild -version | head -1)"
          echo "id=$(printf '%s' "$version" | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            generate-navaids/.build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-docs-macos-26-${{ steps.toolchain.outputs.id }}-${{ hashFiles('generate-navaids/Package.resolved') }}
      # The archive is thrown away; the job exists to fail on DocC warnings.
      - name: Build documentation
        working-directory: generate-navaids
        run: |
          swift package --allow-writing-to-directory "$RUNNER_TEMP/docs" \
            generate-documentation \
            --target generate-navaids \
            --warnings-as-errors \
            --output-path "$RUNNER_TEMP/docs"
