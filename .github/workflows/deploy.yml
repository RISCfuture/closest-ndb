name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '17 9 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs when CI passes
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and never cancel one in flight
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.cycle.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: SwiftyLab/setup-swift@v1.14.2
        with:
          swift-version: '6.4'
      - name: Install ZIP dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Cache SwiftPM build products
        uses: actions/cache@v6.1.0
        with:
          path: |
            generate-navaids/.build
            ~/.cache/org.swift.swiftpm
          key: swiftpm-ndbs-${{ runner.os }}-${{ runner.arch }}-swift6.4-${{ hashFiles('generate-navaids/Package.resolved') }}
      - name: Build generator
        working-directory: generate-navaids
        run: swift build -c release
      - name: Check effective cycle
        id: cycle
        working-directory: generate-navaids
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          cycle="$(.build/release/generate-navaids --print-cycle)"
          publish=true
          if [ "$EVENT_NAME" = schedule ]; then
            status="$(curl --silent --show-error --location --retry 3 \
              --output "$RUNNER_TEMP/published-cycle.txt" --write-out '%{http_code}' \
              "https://riscfuture.github.io/closest-ndb/ndbs-cycle.txt?check=$GITHUB_RUN_ID")"
            case "$status" in
              200)
                if [ "$(cat "$RUNNER_TEMP/published-cycle.txt")" = "$cycle" ]; then
                  publish=false
                fi
                ;;
              404) ;;
              *) echo "Could not read published cycle: HTTP $status" >&2; exit 1 ;;
            esac
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Effective cycle: $cycle; publish: $publish"
      - name: Generate NDB data
        if: steps.cycle.outputs.publish == 'true'
        working-directory: generate-navaids
        run: |
          set -euo pipefail
          .build/release/generate-navaids
          jq -e '
            [.id, .name, .lat, .lon, .freq] as $columns |
            all($columns[]; type == "array") and
            (.id | length > 0) and
            ([$columns[] | length] | unique | length == 1)
          ' ndbs.json
      - name: Upload NDB data
        if: steps.cycle.outputs.publish == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ndb-data
          path: |
            generate-navaids/ndbs.json
            generate-navaids/ndbs-cycle.txt
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: generate
    if: needs.generate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pages
        uses: actions/configure-pages@v6.0.0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download NDB data
        uses: actions/download-artifact@v8.0.2
        with:
          name: ndb-data
          path: public
      - name: Build
        run: pnpm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
      # Sourcemaps must reach Sentry BEFORE they are deleted. Do not reorder.
      - name: Create Sentry release
        uses: getsentry/action-release@v3.7.2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: timcodes
          SENTRY_PROJECT: closest-ndb
        with:
          environment: production
          release: ${{ github.sha }}
          sourcemaps: './dist'
      # Sourcemaps must not reach the public. Do not reorder.
      - name: Strip source maps from the published artifact
        run: find dist -name '*.map' -delete
      - name: Upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'dist/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
