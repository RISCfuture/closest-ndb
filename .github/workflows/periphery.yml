name: Periphery
on:
  push:
    branches: [main]
  pull_request:
jobs:
  periphery:
    runs-on: xcode-27
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest
      - uses: SwiftyLab/setup-swift@v1.14.2
        with:
          swift-version: '6.4.2'
      # The resolved compiler identifies the build cache.
      - name: Record toolchain version
        id: toolchain
        run: |
          version="$(swift --version | head -1)-$(xcodebuild -version | head -1)"
          echo "id=$(printf '%s' "$version" | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6.1.0
        with:
          path: |
            generate-navaids/.build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-periphery-macos-27-${{ steps.toolchain.outputs.id }}-${{ hashFiles('generate-navaids/Package.resolved') }}
      - name: Install Periphery
        run: brew install periphery-pro/tap/periphery-cli
      - name: Run Periphery
        working-directory: generate-navaids
        run: periphery scan --strict -- --build-system native
        env:
          PERIPHERY_TOKEN: ${{ secrets.PERIPHERY_TOKEN }}
