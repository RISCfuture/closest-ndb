<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Page Not Found — Closest NDB</title>
    <meta name="description" content="There is no page at this address." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#7d5732" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#7d5732" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/closest-ndb/favicon.ico" />
    <link rel="apple-touch-icon" href="/closest-ndb/icon-512.png" />
    <link rel="mask-icon" href="/closest-ndb/pinned-tab.svg" color="#7d5732" />

    <!-- The zone's CSP grants 'unsafe-inline' to `style-src-attr` alone, so a
         `<style>` element here would be blocked and the page would render
         unstyled. The stylesheet is a sibling file that Vite copies out of
         `public/` under a stable, unhashed name. -->
    <link rel="stylesheet" href="/closest-ndb/404.css" />
  </head>

  <body>
    <main>
      <p aria-hidden="true" class="morse">−· −·· −···</p>

      <h1>
        <span class="code">404</span>
        <span class="label">Page not found</span>
      </h1>

      <p class="lede">There’s no beacon at this address.</p>

      <p><a class="button" href="/closest-ndb/">Back to the beacon</a></p>
    </main>
  </body>
</html>
